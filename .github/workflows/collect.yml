name: Collect Spotify Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: spotify-profile-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Capture public profile snapshot
        run: npm run sample
        env:
          SPOTIFY_PROFILE_URL: ${{ secrets.SPOTIFY_PROFILE_URL }}
          SPOTIFY_RECENTLY_PLAYED_ARTISTS_URL: ${{ secrets.SPOTIFY_RECENTLY_PLAYED_ARTISTS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
